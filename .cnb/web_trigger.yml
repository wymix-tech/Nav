# 页面自定义按钮：代码 - 分支详情页 → 「流水线」下拉中的自定义按钮
# 文档：https://docs.cnb.cool/zh/build/web-trigger.html
# 注意：这里定义的 event 必须在 .cnb.yml 中存在同名 web_trigger 流水线，否则按钮无法触发。
# 注意：inputs 只用于页面输入，不会注入为流水线环境变量。
# 需要在流水线里使用的值，用 env 预置（env 只读、不可编辑；${xxx} 仅取 env 的值）。

branch:
  # 发布：打 Tag → 生成 Changelog → 创建 Release → 构建并推送 Docker 镜像
  - reg: ^(main|master)$
    buttons:
      - name: 发布 Release
        description: 自动打 Tag、生成 Changelog、发布 Release 并推送 Docker 镜像（${TAG_FORMAT}）
        event: web_trigger_release
        isDefault: true
        permissions:
          roles:
            - owner
            - master
            - developer
        env:
          TAG_FORMAT: 'v${version}'
          PUSH_LATEST: 'true'
        inputs:
          TAG_FORMAT:
            name: Tag 格式
            description: 参考值；${version} 会被替换为实际版本号。修改请编辑 .cnb/web_trigger.yml 的 env
            type: input
            required: true
            default: 'v${version}'
          PUSH_LATEST:
            name: 同时推送 latest 镜像
            description: 参考值。修改请编辑 .cnb/web_trigger.yml 的 env
            type: switch
            default: 'true'
            options:
              - name: 推送 latest
                value: 'true'
              - name: 只推版本号
                value: 'false'
