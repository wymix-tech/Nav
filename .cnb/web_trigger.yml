# 页面自定义按钮：代码 - 分支详情页 → 「流水线」下拉中的自定义按钮
# 文档：https://docs.cnb.cool/zh/build/web-trigger.html
# 注意：这里定义的 event 必须在 .cnb.yml 中存在同名 web_trigger 流水线，否则按钮无法触发。

branch:
  # 发布：打 Tag → 生成 Changelog → 创建 Release → 构建并推送 Docker 镜像
  - reg: ^(main|master)$
    buttons:
      - name: 发布 Release
        description: 自动打 Tag、生成 Changelog、发布 Release 并推送 Docker 镜像（${TAG_FORMAT}）
        event: web_trigger_release
        isDefault: true
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          TAG_FORMAT:
            name: Tag 格式
            description: auto-tag 生成的版本号格式，${version} 会被替换为实际版本号
            type: input
            required: true
            default: 'v${version}'
          PUSH_LATEST:
            name: 同时推送 latest 镜像
            description: 关闭后只推送本次版本号 tag
            type: switch
            default: 'true'
            options:
              - name: 推送 latest
                value: 'true'
              - name: 只推版本号
                value: 'false'
