name: Validate Nav
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
        env:
          NAV_TEST_BROWSERS: chromium,firefox,webkit
      - run: pnpm test:browser
        env:
          NAV_TEST_DIST: 'true'
      - run: docker build -t nav:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
