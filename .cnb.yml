main:
  # 触发事件为 push 事件
  pull_request.merged:
    - services:
      - docker
      stages:
        - name: auto-tag
          image: cnbcool/git-auto-tag:latest
          settings:
            tagFormat: v\${version}
            toFile: tag_info.json
            dryRun: false
            blockWhenFail: false
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
          exports:
            tag: NEW_TAG
        - name: show tag
          script: echo $NEW_TAG
        - name: show tag res
          script: cat tag_info.json
        - name: changelog
          image: cnbcool/changelog
          settings:
            latestChangeLogTarget: LATEST_CHANGELOG.md
        - name: release
          type: git:release
          options:
            tag: $NEW_TAG
            title: $NEW_TAG
            descriptionFromFile: LATEST_CHANGELOG.md
            latest: true
      # 同名镜像构建&推送
        - name: Docker build
          script: docker build --build-arg APP_VERSION=$NEW_TAG -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
        - name: Docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

  # 页面自定义按钮「发布 Release」触发（按钮见 .cnb/web_trigger.yml）
  # 与 pull_request.merged 同流程，版本号格式等参数由 .cnb/web_trigger.yml 的 env 预置
  web_trigger_release:
    - services:
      - docker
      env:
        # 页面按钮的 env 只在 web_trigger 触发时注入；这里兜底，避免经由其他渠道
        # 触发时 $PUSH_LATEST 为空、判断恒为假。
        PUSH_LATEST: 'true'
      stages:
        - name: auto-tag
          image: cnbcool/git-auto-tag:latest
          settings:
            # 不能用 $TAG_FORMAT 间接传递：settings 只做一次变量替换，替换结果里的
            # ${version} 不会再被解析，原样交给插件后 lodash.template 渲染出字面量
            # "v${version}"，auto-tag 报 ETAGNOVERSION（tagFormat 里找不到 version 变量）。
            # 这里直接写字面量 tagFormat，并与其他流水线一致用 \${version} 转义，
            # 避免 CNB 把 ${version} 当变量替换成空串。
            tagFormat: v\${version}
            toFile: tag_info.json
            dryRun: false
            blockWhenFail: false
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
          exports:
            tag: NEW_TAG
        - name: show tag
          script:
            - echo $NEW_TAG
            - cat tag_info.json
        - name: changelog
          image: cnbcool/changelog
          settings:
            tag: $NEW_TAG
            latestChangeLogTarget: LATEST_CHANGELOG.md
        - name: release
          type: git:release
          options:
            tag: $NEW_TAG
            title: $NEW_TAG
            descriptionFromFile: LATEST_CHANGELOG.md
            latest: true
        - name: Docker build
          script: |
            IMAGE=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
            docker build --build-arg APP_VERSION=$NEW_TAG -t ${IMAGE}:$NEW_TAG .
            if [ "${PUSH_LATEST}" = "true" ]; then
              docker tag ${IMAGE}:$NEW_TAG ${IMAGE}:latest
            fi
        - name: Docker push
          script: |
            IMAGE=${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
            docker push ${IMAGE}:$NEW_TAG
            if [ "${PUSH_LATEST}" = "true" ]; then
              docker push ${IMAGE}:latest
            fi

$: 
  push:
    - stages:
        - name: sync to github
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/wymix.top/nav_sync/-/blob/main/env.prod.yml
          settings:
            target_url: https://github.com/wymix-tech/Nav.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
